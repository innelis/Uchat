{% extends "base.html" %}
{% block title %}Sign up · UChat{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">
            <div class="auth-logo-icon">💬</div>
            <h1>UChat</h1>
            <p>Create your account to start chatting.</p>
        </div>
        <form method="POST" class="auth-form">
            <label>Display name
                <input type="text" name="display_name" placeholder="e.g. John Doe" required autofocus>
            </label>
            <label>Username
                <input type="text" name="username" placeholder="e.g. johndoe" required>
            </label>
            <label>Password
                <input type="password" name="password" placeholder="At least 6 characters" required>
            </label>
            <label>Confirm password
                <input type="password" name="confirm_password" placeholder="Repeat password" required>
            </label>
            <button type="submit" class="btn-primary">Create account</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </div>
</div>
{% endblock %}
